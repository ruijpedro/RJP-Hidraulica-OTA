name: Publicar RJP Hidraulica WebApp
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'index.html'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site compilado
        run: |
          set -euo pipefail
          test -f webapp/index.html
          mkdir -p _site
          cp -r webapp _site/webapp
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Carregar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
